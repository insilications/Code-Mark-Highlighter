      selector: switch_statement
      context: "switch ($A) { $$$B }"
    stopBy: "end"
      # selector: lexical_declaration
      # context: "let $REG_STATUS = $_.registrationStatus.UNREGISTERED;"
  inside:
    pattern: "const phoneHome = $_;"
    stopBy: "end"




