<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'nonce-#NNNN#'; script-src 'nonce-#NNNN#';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Mark Highlighter</title>
    <style nonce="#NNNN#">
      /*CSS_CONTENT*/
    </style>
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <span class="header-logo">🔖</span>
      <span class="header-title">Code Mark</span>
      <span class="header-count" id="count">0</span>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <input id="search" type="text" placeholder="Search tags, code…" />
      <select id="filter-tag">
        <option value="">All tags</option>
      </select>
    </div>

    <!-- Highlight List -->
    <div class="list" id="list">
      <div class="empty">
        <div class="empty-icon">✨</div>
        <div class="empty-title">No highlights yet</div>
        <div class="empty-sub">
          Select code → right-click<br />→ <strong>Code Mark: Highlight Code</strong>
        </div>
      </div>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar" id="stats-bar" style="display: none">
      <span id="stat-total">0 highlights</span>
      <span>·</span>
      <span id="stat-files">0 files</span>
    </div>

    <script type="module" nonce="#NNNN#">
      /*JS_CONTENT*/
    </script>
  </body>
</html>
