<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      content="default-src 'none'; style-src 'nonce-#NNNN#'; script-src 'nonce-#NNNN#';"
      http-equiv="Content-Security-Policy"
    />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Code Mark Highlighter</title>
    <style nonce="#NNNN#">
      /*CSS_CONTENT*/
    </style>
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <span class="header-logo">🔖</span>
      <span class="header-title">Code Mark</span>
      <span class="header-count" id="count">0</span>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <input id="search" placeholder="Search tags, code…" type="text" />
      <select id="filter-tag">
        <option id="all-tags" selected value="">All Tags</option>
      </select>
    </div>

    <!-- Highlight List -->
    <div class="list" id="list">
      <div class="empty" id="empty-highlights">
        <div class="empty-icon">✨</div>
        <div class="empty-title">No highlights yet</div>
        <div class="empty-sub">
          Select code → right-click<br />→ <strong>Code Mark: Highlight Code</strong>
        </div>
      </div>
      <div class="empty" id="empty-results">
        <div class="empty-icon">🔍</div>
        <div class="empty-title">No results</div>
        <div class="empty-sub">Try a different search or filter.</div>
      </div>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar" id="stats-bar">
      <span id="stat-total">0 highlights</span>
      <span>·</span>
      <span id="stat-files">0 files</span>
    </div>

    <script nonce="#NNNN#" type="module">
      /*JS_CONTENT*/
    </script>
    <template id="cards">
      <div class="card" id="card">
        <div class="card-top">
          <span class="card-tag"></span>
          <div class="card-actions">
            <button class="btn btn-jump">↗ Jump</button>
            <button class="btn btn-tag" id="btn-tag">🏷 Tag</button>
            <button class="btn btn-color" id="btn-color">🎨 Color</button>
            <button class="btn btn-danger btn-delete" id="btn-delete">🗑</button>
          </div>
          <span class="card-file"></span>
        </div>
        <div class="card-snippet"></div>
      </div>
    </template>
  </body>
</html>
